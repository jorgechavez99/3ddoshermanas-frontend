# Publica la web en GitHub Pages en cada push a main.
# Version provisional en https://jorgechavez99.github.io/3ddoshermanas-frontend/
# (sin indexar en Google) hasta tener dominio propio y VPS.
name: Publicar en GitHub Pages

# Desactivado el automatico: la web vive en el VPS. Se puede lanzar a mano
# desde la pestaña Actions si se quiere una copia en GitHub Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PUBLICAR_EN: github-pages
          NEXT_PUBLIC_SITE_URL: https://jorgechavez99.github.io/3ddoshermanas-frontend
          # La web se sirve en una subcarpeta de github.io.
          RUTA_BASE: /3ddoshermanas-frontend
          NEXT_PUBLIC_NO_INDEXAR: 'true'
      # Sin esto GitHub Pages ignora la carpeta _next de Next.js.
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
