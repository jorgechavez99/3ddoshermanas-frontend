# Publica la web en GitHub Pages en cada push a main.
# Version provisional en https://3ddoshermanas.gastroton.com (sin indexar en
# Google) hasta tener dominio propio y VPS.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PUBLICAR_EN: github-pages
          # Subdominio provisional. Configurado tambien en Settings > Pages > Custom domain.
          NEXT_PUBLIC_SITE_URL: https://3ddoshermanas.gastroton.com
          NEXT_PUBLIC_NO_INDEXAR: 'true'
      # Sin esto GitHub Pages ignora la carpeta _next de Next.js.
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
