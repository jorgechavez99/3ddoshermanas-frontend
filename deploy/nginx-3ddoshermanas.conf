# Proxy de Nginx para 3ddoshermanas.com.
# Si el dominio final es .es, cambiar aqui los server_name, en .env y en DEPLOY.md.
# Redirige www a la version sin www para que Google vea una sola URL por pagina.
server {
    listen 80;
    listen [::]:80;
    server_name www.3ddoshermanas.com;
    return 301 $scheme://3ddoshermanas.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name 3ddoshermanas.com;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Archivos estaticos de Next con hash en el nombre: se pueden cachear un año.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
