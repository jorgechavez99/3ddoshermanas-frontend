# Nginx para la version provisional en 3ddoshermanas.gastroton.com (VPS de IONOS).
# Web (Next.js, PM2 en 127.0.0.1:3010) y API (Express, PM2 en 127.0.0.1:4010)
# en el mismo subdominio: la API cuelga de /api/.
# No toca la configuracion de gastroton.com: es un server_name distinto.
server {
    listen 80;
    listen [::]:80;
    server_name 3ddoshermanas.gastroton.com;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /fotos/ {
        alias /var/www/3ddoshermanas-fotos/;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
